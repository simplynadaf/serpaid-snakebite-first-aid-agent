<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SerpAID — Live Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --green: #38ffb0; --green2: #0fae79; --bg: #070b0a; --panel: #0b1210;
    --panel2: #0a1512; --ink: #eef3f1; --mut: #9fb3ac; --warn: #ffc24b; --alarm: #ff5d5d;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: radial-gradient(1200px 700px at 70% -10%, #0d241b 0%, var(--bg) 55%);
    color: var(--ink); font-family: Inter, system-ui, sans-serif; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; padding: 28px 18px 60px;
  }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
  .brand .dot { width: 11px; height: 11px; border-radius: 50%; background: var(--green);
    box-shadow: 0 0 14px var(--green); }
  .brand h1 { font-family: Fraunces, serif; font-weight: 600; font-size: 26px; letter-spacing: .3px; }
  .brand h1 span { color: var(--green); }
  .tag { color: var(--mut); font-size: 13.5px; margin-bottom: 20px; text-align: center; }
  .tag b { color: var(--green); font-weight: 600; }
  .wrap { width: 100%; max-width: 920px; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 760px) { .wrap { grid-template-columns: 1fr; } }
  .card { background: linear-gradient(180deg, var(--panel), var(--panel2));
    border: 1px solid #16261f; border-radius: 16px; padding: 18px; }
  .card h3 { font-size: 12px; text-transform: uppercase; letter-spacing: 1.4px; color: var(--mut);
    margin-bottom: 12px; font-weight: 600; }
  label { font-size: 12.5px; color: var(--mut); display: block; margin: 10px 0 5px; }
  textarea, select {
    width: 100%; background: #060d0b; color: var(--ink); border: 1px solid #1c3029;
    border-radius: 10px; padding: 11px 12px; font-family: Inter, sans-serif; font-size: 14.5px;
    resize: vertical; }
  textarea { min-height: 96px; }
  .row { display: flex; gap: 10px; }
  .row > div { flex: 1; }
  .quick { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 10px; }
  .quick button { background: #0e1b16; color: var(--mut); border: 1px solid #1c3029;
    border-radius: 999px; padding: 6px 11px; font-size: 12px; cursor: pointer; transition: .15s; }
  .quick button:hover { color: var(--green); border-color: var(--green2); }
  .go { margin-top: 14px; width: 100%; background: var(--green); color: #05231a; border: none;
    border-radius: 11px; padding: 13px; font-size: 15px; font-weight: 600; cursor: pointer;
    letter-spacing: .3px; transition: .15s; }
  .go:hover { filter: brightness(1.08); }
  .go:disabled { opacity: .5; cursor: wait; }
  .sev { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 600;
    padding: 5px 11px; border-radius: 999px; margin-bottom: 10px; }
  .sev.emergency { background: rgba(255,93,93,.12); color: var(--alarm); border: 1px solid rgba(255,93,93,.4); }
  .sev.urgent { background: rgba(255,194,75,.12); color: var(--warn); border: 1px solid rgba(255,194,75,.4); }
  .myth { background: rgba(255,93,93,.08); border-left: 3px solid var(--alarm);
    padding: 10px 12px; border-radius: 8px; font-size: 13.5px; margin-bottom: 12px; }
  .myth b { color: var(--alarm); }
  .resp { white-space: pre-wrap; font-size: 14.5px; line-height: 1.6; }
  .resp.big { font-size: 16px; }
  .meta { color: var(--mut); font-size: 12px; margin-top: 12px; display: flex; align-items: center; gap: 8px; }
  .live { display: inline-flex; align-items: center; gap: 6px; color: var(--green); font-weight: 600; }
  .live .pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--green);
    animation: p 1.1s infinite; }
  @keyframes p { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.35;transform:scale(.7)} }
  .placeholder { color: var(--mut); font-size: 14px; font-style: italic; }
  .speaking { color: var(--green); font-size: 12.5px; margin-top: 8px; display: none; }
</style>
</head>
<body>
  <div class="brand"><span class="dot"></span><h1>Serp<span>AID</span> · live agent</h1></div>
  <p class="tag">Type a real panicked message. The agent runs the <b>WHO engine</b> live, translates with <b>Amazon Translate</b>, and speaks it with <b>Amazon Polly</b>. Nothing is pre-recorded.</p>

  <div class="wrap">
    <div class="card">
      <h3>The caller's message</h3>
      <textarea id="msg" placeholder="e.g. My cousin was bitten by a snake. Should I tie a tight cloth above it?"></textarea>
      <div class="quick" id="quick"></div>
      <div class="row" style="margin-top:12px">
        <div>
          <label>Answer in</label>
          <select id="lang">
            <option value="hi">Hindi (voice)</option>
            <option value="es">Spanish (voice)</option>
            <option value="fr">French (voice)</option>
            <option value="pt">Portuguese (voice)</option>
            <option value="ar">Arabic (voice)</option>
            <option value="en">English (voice)</option>
          </select>
        </div>
        <div>
          <label>Country</label>
          <select id="region">
            <option value="IN">India (108)</option>
            <option value="KE">Kenya</option>
            <option value="NG">Nigeria</option>
            <option value="BR">Brazil</option>
            <option value="US">USA (911)</option>
          </select>
        </div>
      </div>
      <button class="go" id="go">Get live guidance &amp; speak it</button>
    </div>

    <div class="card">
      <h3>SerpAID responds</h3>
      <div id="out"><p class="placeholder">The live, translated, spoken answer will appear here.</p></div>
    </div>
  </div>

  <audio id="player" hidden></audio>

<script>
const QUICK = [
  { t: "My cousin was bitten on the ankle. Should I tie a tight cloth and take him to the village healer? His eyelids feel heavy.", lang: "hi", region: "IN" },
  { t: "A farm worker was bitten in the field. We packed the wound in ice while we wait. He is far from any clinic.", lang: "pt", region: "BR" },
  { t: "My son was bitten by a snake and now he is having trouble breathing. Someone is trying to suck the venom out.", lang: "es", region: "US" },
  { t: "A woman was bitten near the river and the wound keeps bleeding. We are scared.", lang: "fr", region: "KE" },
];
const q = document.getElementById('quick');
QUICK.forEach((c, i) => {
  const b = document.createElement('button');
  b.textContent = "Case " + (i + 1);
  b.onclick = () => { document.getElementById('msg').value = c.t;
    document.getElementById('lang').value = c.lang; document.getElementById('region').value = c.region; };
  q.appendChild(b);
});

const out = document.getElementById('out');
const go = document.getElementById('go');
const player = document.getElementById('player');

go.onclick = async () => {
  const text = document.getElementById('msg').value.trim();
  const lang = document.getElementById('lang').value;
  const region = document.getElementById('region').value;
  if (!text) return;
  go.disabled = true; go.textContent = "Agent is working live…";
  out.innerHTML = '<div class="meta"><span class="live"><span class="pulse"></span>live</span> calling WHO engine + Amazon Translate…</div>';
  try {
    const r = await fetch('/ask', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text, lang, region_code: region }) });
    const d = await r.json();
    render(d, lang);
    // speak it live
    const s = await fetch('/speak', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: d.spoken || d.translated, lang }) });
    const blob = await s.blob();
    player.src = URL.createObjectURL(blob);
    document.getElementById('speaking').style.display = 'flex';
    await player.play();
    player.onended = () => { document.getElementById('speaking').style.display = 'none'; };
  } catch (e) {
    out.innerHTML = '<p class="placeholder">Error: ' + e + '</p>';
  }
  go.disabled = false; go.textContent = "Get live guidance & speak it";
};

function render(d, lang) {
  let h = '';
  h += '<span class="sev ' + d.severity + '">' + (d.severity === 'emergency' ? '🚨 EMERGENCY' : '⚠ URGENT') + '</span>';
  if (d.myth) h += '<div class="myth"><b>Caught a dangerous action:</b> ' + d.myth.correction + '</div>';
  h += '<div class="resp big">' + escapeHtml(d.translated) + '</div>';
  h += '<div class="meta"><span class="live"><span class="pulse"></span>live</span> ' + d.lang_label +
       ' · Amazon Translate + Polly · emergency ' + d.emergency_number + '</div>';
  h += '<div class="speaking" id="speaking"><span class="live"><span class="pulse"></span></span>🔊 speaking live with Amazon Polly…</div>';
  out.innerHTML = h;
}
function escapeHtml(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
</script>
</body>
</html>
